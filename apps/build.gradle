/* will produce a fat jar containing all html/js dist in public_html/apps*/

import groovy.io.FileType
import java.nio.file.Files

plugins {
    id "java"
    id "com.github.node-gradle.node" version "7.1.0"
}

java {
    targetCompatibility = rootProject.ext.javaVersion
    sourceCompatibility = rootProject.ext.javaVersion
}

def isCI = System.getenv('CI') ? true : false


node {
    version = '22.19.0'
    pnpmVersion = "10.24.0"
    download = true
    workDir = file("build/node")
}

// we want the javascript build/lint/format to fire on changes in the project folders
// excluding build and node_modules folders
def excludeFolders = ["node_modules",".gradle","build",".turbo",".vscode", ".nuxt", ".output"]

ext.listProjectFolders = { List<String> excludeNames = excludeFolders ->
    def base = project.projectDir
    def children = base.listFiles()
    if (children == null) {
        return []
    }
    return children.findAll { f ->
        f.isDirectory() && !excludeNames.contains(f.name) && new File(f,"package.json").exists()
    }.collect { it.name }
}
def workspaceDirs = listProjectFolders()
println "Workspace dirs = $workspaceDirs"

def buildOutputFolders = ["dist", "showCase", "gen-docs"]

def buildOutputDirForApp = { String appName ->
    if (file("${appName}/nuxt.config.ts").exists()) {
        return "${appName}/.output"
    }
    return "${appName}/dist"
}

def registerAppInputs(Task task, List<String> workspaceDirs, List<String> excludeFolders) {
    //include all files in root
    project.projectDir.listFiles().findAll { it.isFile() }.each {file ->
            task.inputs.file(file);
    }
    //include all files in the app folders except build files
    workspaceDirs.each { f ->
        def dir = project.file(f)
        task.inputs.files(
                task.project.fileTree(f) {
                    include "**/*"
                    exclude excludeFolders
                }
        )
    }
}

def registerAppInputsOutputs(Task task, List<String> workspaceDirs, List<String> excludeFolders) {
    registerAppInputs(task, workspaceDirs, excludeFolders)
    task.outputs.upToDateWhen { true }
}

tasks.withType(PnpmTask).configureEach {
    environment.putAll(rootProject.ext.molgenisDotenv)
}

tasks.register('pnpm_install', PnpmTask) {
    args = ['install']
    inputs.file("package.json")
    def optionalFile = file("pnpm-lock.yaml")
    if(optionalFile.exists())     inputs.file(optionalFile)
    workspaceDirs.each { dir ->
        inputs.file("${project.projectDir}/${dir}/package.json")
    }
    outputs.file("${project.projectDir}/node_modules/.pnpm-workspace-state-v1.json")
}

tasks.register('pnpm_build', PnpmTask) {
    dependsOn 'pnpm_install'
    args = ['run', 'build']
    inputs.property('molgenisDotenv', rootProject.ext.molgenisDotenv)
    registerAppInputs(delegate, workspaceDirs, excludeFolders + buildOutputFolders)
    outputs.dirs(workspaceDirs.collect { buildOutputDirForApp(it) })
}

def gitCommonDirOutput = providers.exec { spec ->
    spec.commandLine('git', 'rev-parse', '--git-common-dir')
    spec.workingDir = rootDir
    spec.ignoreExitValue = true
}.standardOutput.asText

def turboCacheDir = gitCommonDirOutput.map { output ->
    String path = output.trim()
    if (path.isEmpty()) {
        return null
    }
    File gitCommonDir = new File(path)
    if (!gitCommonDir.isAbsolute()) {
        gitCommonDir = new File(rootDir, path)
    }
    return new File(gitCommonDir.canonicalFile.parentFile, ".turbo/cache")
}

// Util task to clean up all apps files created during build
tasks.register("cleanApps", Delete) {
    doFirst {
        // delete build directory as before
        delete(project.layout.buildDirectory)
        File turboCache = turboCacheDir.getOrNull()
        if (turboCache != null) {
            delete turboCache
        }
        delete file("${project.projectDir}/.turbo")
        delete file("${project.projectDir}/.nuxt")
        delete file("${project.projectDir}/.output")


        // delete only known workspace folders' generated things; no global fileTree over repo
        workspaceDirs.each { dirName ->
            def dir = project.file(dirName)
            if (dir.exists()) {
                delete new File(dir, ".turbo")
                delete new File(dir, ".nuxt")
                delete new File(dir, "build")
                delete file(buildOutputDirForApp(dirName))
                buildOutputFolders.each { folderName ->
                    delete new File(dir, folderName)
                }
            }
        }
    }

    outputs.upToDateWhen { false } // still always run when invoked
}
clean.dependsOn 'cleanApps';

// Custom task to repair the dist folders the jar packages directly
// Need because gradle cannot properly detect dynamic folders created by npm workspaces
abstract class RepairAppDistTask extends DefaultTask {
    @Internal
    abstract DirectoryProperty getAppsDirectory()

    @Internal
    abstract ListProperty<String> getAppNames()

    @TaskAction
    void repair() {
        File appsDir = appsDirectory.get().asFile
        appNames.get().each { appName ->
            File appDir = new File(appsDir, appName)
            File distDir = new File(appDir, "dist")
            if (distDir.exists()) {
                repairStaleDistDir(appDir, distDir)
            }
        }
    }

    void repairStaleDistDir(File appDir, File distDir) {
        File nuxtPublicDir = new File(appDir, ".output/public")
        if (!nuxtPublicDir.isDirectory() || Files.isSymbolicLink(distDir.toPath())) {
            return
        }
        int removedFiles = 0
        distDir.eachFileRecurse(FileType.FILES) { removedFiles++ }
        logger.lifecycle("Replacing ${distDir} with a symlink to ${nuxtPublicDir} and discarding " +
                "${removedFiles} stale file(s), because nuxt only creates that symlink when nothing " +
                "is there and would otherwise let the stale bytes reach the jar")
        distDir.deleteDir()
        try {
            Files.createSymbolicLink(distDir.toPath(), nuxtPublicDir.toPath())
        } catch (IOException | UnsupportedOperationException e) {
            throw new GradleException(
                    "${distDir} held stale bytes and was removed, but this platform refused to create " +
                            "the symlink to ${nuxtPublicDir} that replaces it. Rebuild the app.", e)
        }
    }

    static File distDirForApp(File appsDirectory, String appName) {
        File appDir = new File(appsDirectory, appName)
        File showCaseDir = new File(appDir, "showCase")
        File distDir = new File(appDir, "dist")
        if (showCaseDir.exists()) {
            return showCaseDir
        }
        if (distDir.exists()) {
            return distDir.canonicalFile
        }
        return null
    }

}

tasks.register("repairAppDistBeforeBuild", RepairAppDistTask) {
    appsDirectory.set(layout.projectDirectory)
    appNames.set(workspaceDirs)
}

tasks.register("repairAppDistAfterBuild", RepairAppDistTask) {
    dependsOn("pnpm_build")
    appsDirectory.set(layout.projectDirectory)
    appNames.set(workspaceDirs)
}

tasks.named("pnpm_build") {
    dependsOn("repairAppDistBeforeBuild")
}

tasks.register('format', PnpmTask) {
    dependsOn 'pnpm_install'
    if (!isCI) {
        args = ['run', 'format']
    } else {
        args = ['run', 'checkFormat']
    }
    registerAppInputsOutputs(delegate, workspaceDirs, excludeFolders + buildOutputFolders)
}

tasks.register('lint', PnpmTask) {
    dependsOn 'pnpm_build'
    args = ['run', 'lint']
    registerAppInputsOutputs(delegate, workspaceDirs, excludeFolders)
}

tasks.register('testJavascript', PnpmTask) {
    dependsOn 'pnpm_build'
    args = ['run', 'test-ci']
    registerAppInputsOutputs(delegate, workspaceDirs, excludeFolders)
}

test.dependsOn 'testJavascript'

// Link the app build to the java jar, reading each app's own output folder so no tree is staged twice
tasks.named("processResources") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn("repairAppDistAfterBuild")

    def appsDir = project.projectDir
    workspaceDirs.each { appName ->
        from(providers.provider { RepairAppDistTask.distDirForApp(appsDir, appName) ?: [] }) {
            into("public_html/apps/${appName}")
        }
    }
}