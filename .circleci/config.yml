version: 2.1

parameters:
  GHA_Actor:
    type: string
    default: ""
  GHA_Event:
    type: string
    default: ""
  GHA_Action:
    type: string
    default: ""
  GHA_Meta:
    type: string
    default: ""

orbs:
  slack: circleci/slack@6.1.3
  queue: eddiewebb/queue@3.3.3

definitions:
  build_config: &build_config
    docker:
    - image: molgenis/ci-build:1.6.2
    working_directory: ~/repo
    resource_class: large
    environment:
      JVM_OPTS: -Xmx6400m
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.console=plain"
      TERM: dumb
  test_config: &test_config
    docker:
    - image: molgenis/ci-build:1.6.2
    - image: postgres:15-alpine
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
    working_directory: ~/repo
    resource_class: large
    environment:
      JVM_OPTS: -Xmx6400m
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.console=plain"
      TERM: dumb
  release_config: &release_config
    docker:
      - image: molgenis/ci-build:1.6.2
      - image: postgres:15-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
    working_directory: ~/repo
    resource_class: large
    environment:
      JVM_OPTS: -Xmx6400m
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.caching=false -Dorg.gradle.console=plain"
      TERM: dumb


commands:
  pre_steps:
    steps:
    - run:
        name: Fresh Git Checkout to prevent missing objects
        command: |
          rm -rf .git
          git init
          git remote add origin "$CIRCLE_REPOSITORY_URL"
          GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" \
            git fetch origin +refs/heads/*:refs/remotes/origin/* --prune
          GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" \
            git fetch origin +refs/tags/*:refs/tags/* --prune
          git checkout -f "$CIRCLE_BRANCH"
    - run:
        name: Setup git, todo, move to molgenisci user
        command: |
          git config --global --add safe.directory '*'
          git config user.email "m.a.swertz@rug.nl"
          git config user.name "mswertz"
          git config url.https://.insteadOf git://
    - run:
        name: run-pnpm-audit
        command:  pnpm dlx --config.minimumReleaseAge=0 pnpm@11.0.0-rc.1 --config.manage-package-manager-versions=false audit --audit-level=critical
        working_directory: apps
    - setup_remote_docker:
        docker_layer_caching: true
    - run:
        name: Sign in to docker
        command: docker login -u $DOCKER_USER -p $DOCKER_PASS

  gradle_pre_steps:
    steps:
    - run:
          name: Concatenate Build Files as key for cache
          command: |
              find . -name 'build.gradle' -type f -exec cat {} \; > concatenated-build-gradle
          no_output_timeout: 5m
    - restore_cache:
        keys:
          - gradle-deps-v1-{{ checksum "concatenated-build-gradle" }}
          - gradle-deps-v1-
    - restore_cache:
        keys:
        - gradle-wrapper-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
    - run:
        name: Download Dependencies
        command: ./gradlew dependencies --no-daemon
    - save_cache:
        paths:
          - ~/.gradle/wrapper
        key: gradle-wrapper-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
    - save_cache:
        paths:
          - ~/.gradle/caches/modules-2
          - ~/.gradle/caches/jars-9
        key: gradle-deps-v1-{{ checksum "concatenated-build-gradle" }}

  restore_gradle_build_cache:
    steps:
    - restore_cache:
        keys:
          - gradle-buildcache-v1-{{ .Revision }}
          - gradle-buildcache-v1-

  save_gradle_build_cache:
    steps:
    - run:
        name: Drop gradle build cache entries unused for 7 days before archiving
        command: |
          if [ -d ~/.gradle/caches/build-cache-1 ]; then
            find ~/.gradle/caches/build-cache-1 -type f ! -name '*.lock' ! -name '*.properties' -mtime +7 -delete
            du -sh ~/.gradle/caches/build-cache-1
          else
            echo "no gradle build cache to prune"
          fi
    - save_cache:
        paths:
          - ~/.gradle/caches/build-cache-1
        key: gradle-buildcache-v1-{{ .Revision }}

  restore_turbo_cache:
    steps:
    - restore_cache:
        keys:
          - turbo-v1-{{ .Revision }}
          - turbo-v1-

  save_turbo_cache:
    steps:
    - run:
        name: Drop turbo cache entries unused for 7 days before archiving
        command: |
          if [ -d apps/.turbo/cache ]; then
            find apps/.turbo/cache -type f -mtime +7 -delete
            du -sh apps/.turbo/cache
          else
            echo "no turbo cache to prune"
          fi
    - save_cache:
        paths:
          - apps/.turbo/cache
        key: turbo-v1-{{ .Revision }}

  restore_pnpm_store:
    steps:
    - run:
        name: Pin the store of the pnpm that performs the install, and key on its version
        command: |
          sed -n 's/.*"packageManager" *: *"pnpm@\([^"]*\)".*/\1/p' apps/package.json > pnpm-version
          sed -n 's/.*pnpmVersion *= *"\([^"]*\)".*/\1/p' apps/build.gradle >> pnpm-version
          echo "pnpm versions that perform the install: $(tr '\n' ' ' < pnpm-version)"
          if [ -z "${BASH_ENV:-}" ]; then
            echo "PNPM_STORE_PIN_IGNORED: BASH_ENV is unset so npm_config_store_dir cannot reach the install"
          else
            echo "export npm_config_store_dir=\"$HOME/.pnpm-store\"" >> "$BASH_ENV"
            echo "npm_config_store_dir exported as $HOME/.pnpm-store"
          fi
    - restore_cache:
        keys:
          - pnpm-store-v2-{{ checksum "pnpm-version" }}-{{ checksum "apps/pnpm-lock.yaml" }}
          - pnpm-store-v2-{{ checksum "pnpm-version" }}-
          - pnpm-store-v2-

  save_pnpm_store:
    parameters:
      strict:
        type: boolean
        default: true
    steps:
    - run:
        name: Verify the install populated the cached store, quarantine the key if it did not
        command: |
          STRICT="<< parameters.strict >>"
          STORE_DIR="$HOME/.pnpm-store"
          if [ -n "$(find "$STORE_DIR" -type f -print -quit 2>/dev/null)" ]; then
            du -sh "$STORE_DIR"
          else
            echo "PNPM_STORE_PIN_IGNORED: nothing was installed into $STORE_DIR, the installing pnpm used another store"
            echo "store-pin-broken" >> pnpm-version
            if [ "$STRICT" = "true" ]; then
              exit 1
            fi
          fi
    - save_cache:
        paths:
          - ~/.pnpm-store
        key: pnpm-store-v2-{{ checksum "pnpm-version" }}-{{ checksum "apps/pnpm-lock.yaml" }}

  restore_apt_postgres_client:
    steps:
    - run:
        name: Key the apt archives and lists on the pinned major, the image and the architecture
        command: |
          {
            echo "postgresql-client-15"
            (. /etc/os-release && echo "$VERSION_CODENAME")
            dpkg --print-architecture
            sed -n 's|.*image: *mcr\.microsoft\.com/playwright:\(.*\)$|\1|p' .circleci/config.yml
          } > apt-postgres-client-key
          echo "apt postgres client cache key inputs: $(tr '\n' ' ' < apt-postgres-client-key)"
    - restore_cache:
        keys:
          - apt-postgres-client-v1-{{ checksum "apt-postgres-client-key" }}

  save_apt_postgres_client:
    steps:
    - save_cache:
        paths:
          - /var/cache/apt/archives
          - /var/lib/apt/lists
          - /etc/apt/sources.list.d/pgdg.list
          - /usr/share/postgresql-common/pgdg
        key: apt-postgres-client-v1-{{ checksum "apt-postgres-client-key" }}

  restore_demo_dump:
    steps:
    - run:
        name: Compute the demo-dump cache key over backend, data and the EMX2 jar
        command: bash ci/e2e_demo_dump.sh key
    - restore_cache:
        keys:
          - emx2-demo-dump-v1-{{ checksum "emx2-demo-dump-key" }}
    - run:
        name: Restore the cached demo database, or fall back to a full import
        command: bash ci/e2e_demo_dump.sh restore

  save_demo_dump:
    steps:
    - run:
        name: Dump the imported demo database for the next run
        command: bash ci/e2e_demo_dump.sh save
    - save_cache:
        paths:
          - ~/emx2-demo-dump
        key: emx2-demo-dump-v1-{{ checksum "emx2-demo-dump-key" }}

  post_steps:
    steps:
    - run:
        name: Save test results for stats
        command: |
          mkdir -p ~/test-results/junit/
          find . -type f -regex ".*/build/test-results/.*xml" -exec cp {} ~/test-results/junit/ \;
        when: always
    - store_test_results:
        path: ~/test-results
#    - store_artifacts:
#        path: ./build/libs

# jobs for pull request and master
jobs:
  build:
    <<: *build_config

    steps:
      - pre_steps
      - gradle_pre_steps
      - restore_gradle_build_cache
      - restore_turbo_cache
      - restore_pnpm_store
      - run:
          name: build application
          command: ./gradlew shadowJar dockerPrepare -x test ci --no-daemon

      - run:
          name: build ssr catalogue
          command: pnpm exec turbo run build --filter=catalogue
          working_directory: apps

      - save_pnpm_store

      - persist_to_workspace:
          root: .
          paths:
            - build/libs
            - build/docker/deps
            - build/docker/app
            - build/ci.properties
            - apps/catalogue
            - custom-app/

  e2e-tests:
    resource_class: large
    docker:
      - image: mcr.microsoft.com/playwright:v1.61.0-jammy
        environment:
          JVM_OPTS: -Xmx6400m
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.console=plain"
          TERM: dumb
      - image: postgres:15-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
    steps:
      - checkout
      - attach_workspace:
            at: /workspace

      - run:
          name: Enable pnpm
          command: |
            corepack enable
            corepack prepare pnpm@10.24.0 --activate
            pnpm -v

      - restore_pnpm_store

      - run:
          name: Install dependencies
          command: |
            (cd apps && pnpm install)
            (cd e2e && pnpm install --frozen-lockfile)

      - save_pnpm_store

      - run:
          name: Verify Playwright agrees with the browsers this image ships
          command: |
            IMAGE_VERSION=$(sed -n 's|.*image: mcr\.microsoft\.com/playwright:v\([0-9][0-9.]*\)-.*|\1|p' .circleci/config.yml | head -1)
            if [ -z "$IMAGE_VERSION" ]; then
              echo "could not read the playwright image tag from .circleci/config.yml"
              exit 1
            fi
            for PLAYWRIGHT_BIN in e2e/node_modules/.bin/playwright apps/tailwind-components/node_modules/.bin/playwright; do
              INSTALLED_VERSION=$("$PLAYWRIGHT_BIN" --version | sed 's/^Version //')
              echo "$PLAYWRIGHT_BIN reports $INSTALLED_VERSION, image ships v$IMAGE_VERSION"
              if [ "$INSTALLED_VERSION" != "$IMAGE_VERSION" ]; then
                echo "playwright $INSTALLED_VERSION does not match image v$IMAGE_VERSION"
                exit 1
              fi
            done
            EXPECTED_BROWSERS=$(e2e/node_modules/.bin/playwright install --dry-run | grep -A1 'playwright chromium' | sed -n 's|.*Install location: *||p' || true)
            FOUND=$(printf '%s\n' "$EXPECTED_BROWSERS" | grep -c . || true)
            if [ "$FOUND" != "2" ]; then
              echo "expected 2 chromium install locations, found $FOUND in: $EXPECTED_BROWSERS"
              exit 1
            fi
            for BROWSER_DIR in $EXPECTED_BROWSERS; do
              if [ ! -d "$BROWSER_DIR" ]; then
                echo "browser missing from the image: $BROWSER_DIR"
                exit 1
              fi
              echo "browser present: $BROWSER_DIR"
            done

      - run:
          name: Put custom app next to jar
          command: cp -r /workspace/custom-app /workspace/build/libs/custom-app

      - restore_apt_postgres_client

      - run:
          name: install postgres client matching the postgres 15 service
          command: |
            echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/99keep-downloaded-packages
            installFromRestoredAptCache() {
              [ -s /etc/apt/sources.list.d/pgdg.list ] || return 1
              [ -n "$(find /var/lib/apt/lists -name '*_Packages*' -print -quit 2>/dev/null)" ] || return 1
              apt-get install -y postgresql-client-15
            }
            installFromPostgresqlOrg() {
              apt-get install -y curl ca-certificates
              install -d /usr/share/postgresql-common/pgdg
              curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
              echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
                > /etc/apt/sources.list.d/pgdg.list
              apt-get update
              apt-get install -y postgresql-client-15
            }
            if installFromRestoredAptCache; then
              echo "postgres client installed from the restored apt cache, apt-get update was skipped"
            else
              echo "APT_CACHE_UNUSABLE: installing from the network"
              apt-get update
              if ! installFromPostgresqlOrg; then
                echo "postgresql-client-15 is unavailable, falling back to the distribution client"
                echo "pg_dump will refuse the newer server, so the demo dump cache stays empty"
                apt-get install -y postgresql-client
              fi
            fi
            psql --version
            pg_dump --version

      - save_apt_postgres_client

      - run:
          name: prepare sql test database
          command: psql -h 127.0.0.1 -p 5432 -U postgres < .circleci/initdb.sql

      - restore_demo_dump

      - run:
          name: Install Java
          command: |
            apt-get update
            apt-get install -y openjdk-21-jdk

      - run:
          name: Show jars
          command: |
            ls -la /workspace/build/libs

      - run:
          name: Make jar executable
          command: |
            chmod +x /workspace/build/libs/molgenis-emx2-*-all.jar

      - run:
          name: start the application in the background
          command: |
            export $( cat build/ci.properties | xargs )
            if [ "${MOLGENIS_DEMO_DUMP_RESTORED:-false}" = "true" ]; then
              echo "booting against the restored demo database, so no demo is imported"
            else
              export MOLGENIS_INCLUDE_CATALOGUE_DEMO=true
              export MOLGENIS_INCLUDE_TYPE_TEST_DEMO=true
              export MOLGENIS_INCLUDE_PATIENT_REGISTRY_DEMO=true
              export MOLGENIS_INCLUDE_DIRECTORY_DEMO=true
            fi
            export E2E_BASE_URL=http://localhost:8080/
            export MOLGENIS_OIDC_CLIENT_ID=emx2-local
            export MOLGENIS_OIDC_CLIENT_SECRET=${LOCAL_OIDC_CLIENT_SECRET}
            export MOLGENIS_OIDC_DISCOVERY_URL=https://auth1.molgenis.net/realms/Molgenis/.well-known/openid-configuration
            nohup java -jar /workspace/build/libs/molgenis-emx2-*-all.jar > application.log 2>&1 < /dev/null &
            echo $! > application.pid
            echo "Started PID: $(cat application.pid)"
            sleep 5
            echo "Checking if process is still running..."
            ps -p $(cat application.pid) || echo "❌ Process died immediately"
            echo "Last logs:"
            tail -200 application.log

      - run:
          name: Wait for application to be up, poll every 5 seconds
          command: |
            GETURL="http://localhost:8080/pet%20store/tables#/"
            MAX_RETRIES=480
            RETRY=0

            while true; do
              # Run curl, suppress output, get status code only
              STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" "$GETURL" || echo "")

              echo "HTTP status: ${STATUS:-none}"

              if [[ "$STATUS" == "200" ]]; then
              echo "✅ Application is up"
              break
              else
              echo "⏳ Application not ready yet, waiting 5 seconds..."
              fi

              RETRY=$((RETRY + 1))
              if [[ "$RETRY" -ge "$MAX_RETRIES" ]]; then
              echo "❌ Gave up after $MAX_RETRIES attempts"
              exit 1
              fi

              sleep 1
            done

      - save_demo_dump

      - run:
          name: Test tailwind components
          command: |
            export E2E_BASE_URL=http://localhost:8080/apps/tailwind-components/#/
            pnpm install
            pnpm --filter tailwind-components run e2e
          working_directory: apps

      - store_test_results:
          path: apps/tailwind-components/test-results

      - store_artifacts:
          path: apps/tailwind-components/test-results

      - store_artifacts:
          path: apps/tailwind-components/playwright-report

      - run:
          name: Directory e2e tests
          command: |
            export E2E_BASE_URL=http://localhost:8080/
            pnpm install
            pnpm --filter directory run e2e
          working_directory: apps

      - store_test_results:
          path: apps/directory/test-results

      - store_artifacts:
          path: apps/directory/test-results

      - run:
          name: UI tests
          command: |
            export E2E_BASE_URL=http://localhost:8080/apps/ui/
            pnpm install
            pnpm --filter ui run e2e
          working_directory: apps

      - store_test_results:
          path: apps/ui/test-results

      - store_artifacts:
          path: apps/ui/test-results

      - run:
          name: Run non ssr e2e tests
          command: |
            export $( cat build/ci.properties | xargs )
            e2e/node_modules/.bin/playwright test --config e2e e2e/tests

      - store_test_results:
          path: e2e/test-results

      - store_artifacts:
          path: e2e/test-results

      - run:
          name: Catalogue ssr tests
          command: |
            cp -r /workspace/apps/catalogue/.output  /root/project/apps/catalogue/.output
            export NUXT_PUBLIC_API_BASE=http://localhost:8080/                  
            pnpm install
            pnpm --filter catalogue run e2e
          working_directory: apps

      - store_test_results:
          path: apps/catalogue/test-results

      - store_artifacts:
          path: apps/catalogue/test-results

  test:
    <<: *test_config

    steps:
    - pre_steps
    - gradle_pre_steps
    - restore_gradle_build_cache
    - restore_turbo_cache
    - restore_pnpm_store

    - run:
        name: prepare sql test database
        command: psql -h 127.0.0.1 -p 5432 -U postgres < .circleci/initdb.sql

    - run:
        name: <apps> check code format
        command: ./gradlew :apps:format

    - run:
        name: <apps> lint the code
        command: |
          ./gradlew lint ci --no-daemon \
          -Dorg.ajoberstar.grgit.auth.username=${GITHUB_TOKEN} -Dorg.ajoberstar.grgit.auth.password

    - run:
        name: <apps> unit test the code
        command: ./gradlew :apps:test

    - save_turbo_cache
    - save_pnpm_store

    - run:
        name: <backend> check code format
        command: |
          ./gradlew --continue spotlessCheck
    - run: # Separate from spotless due to pmd running compile step (and therefore spotlessApply)
        name: <backend> check for programming flaws
        command: |
          ./gradlew --continue pmdMain pmdTest
    - run:
        name: run tests and push to sonar
        command: |
          ./gradlew test jacocoMergedReport sonar --no-daemon -x :apps:test \
          -Dorg.ajoberstar.grgit.auth.username=${GITHUB_TOKEN} -Dorg.ajoberstar.grgit.auth.password \
          -Dsonar.token=${SONAR_TOKEN} -Dsonar.organization=molgenis -Dsonar.host.url=https://sonarcloud.io -Dsonar.verbose=true \
          -Dsonar.pullrequest.key=${CIRCLE_PULL_REQUEST##*/} -Dsonar.pullrequest.branch=${CIRCLE_BRANCH}

    - save_gradle_build_cache

    - post_steps

    # LAST step of this job on purpose: it writes a repo-root .env, which would otherwise change the
    # gradle and turbo input hashes of every step after it.
    - run:
        name: <dev> a repo-root .env reaches the forked dev JVM
        command: |
          set -eo pipefail
          printf '%s\n' \
            'MOLGENIS_HTTP_PORT=19345' \
            'MOLGENIS_JVM_XMX=333m' \
            'MOLGENIS_POSTGRES_PASS=ci-guardrail-secret' > .env
          export MOLGENIS_HTTP_PORT=19999
          ./gradlew -q --console=plain --no-daemon printDevConfig -DMOLGENIS_CI_PROBE=probe-value \
            | tee printDevConfig.out
          grep -Fxq 'molgenis.dev.systemProperty.MOLGENIS_HTTP_PORT=19345' printDevConfig.out
          grep -Fxq 'molgenis.dev.systemProperty.MOLGENIS_CI_PROBE=probe-value' printDevConfig.out
          grep -Fxq 'molgenis.dev.systemProperty.MOLGENIS_POSTGRES_PASS=<HIDDEN>' printDevConfig.out
          grep -Fxq 'molgenis.dev.maxHeapSize=333m' printDevConfig.out
    - run:
        name: <dev> remove the temporary .env
        command: rm -f .env printDevConfig.out
        when: always

  release:
    <<: *release_config

    steps:
    - queue/until_front_of_line:
        limit-branch-name: main
        max-wait-time: '25'
        my-pipeline: <<pipeline.number>>
        
    - pre_steps
    - gradle_pre_steps
    - restore_pnpm_store

    - run:
        name: Switch git remote to HTTPS for Nyx tag push
        command: git remote set-url origin https://github.com/molgenis/molgenis-emx2.git

    - run:
        name: prepare sql test database
        command: psql -h 127.0.0.1 -p 5432 -U postgres < .circleci/initdb.sql

    - run:
        name: lint the code
        command: |
          ./gradlew lint ci --no-daemon \
          -Dorg.ajoberstar.grgit.auth.username=${GITHUB_TOKEN} -Dorg.ajoberstar.grgit.auth.password

    - save_pnpm_store:
        strict: false

    - run:
        name: Run tests, merge test results using jacoco and push test results to sonar for the branch (or fail)
        command: |
          ./gradlew test jacocoMergedReport sonar ci dockerBuild --no-daemon \
          -Dorg.ajoberstar.grgit.auth.username=${GITHUB_TOKEN} -Dorg.ajoberstar.grgit.auth.password \
          -Dsonar.token=${SONAR_TOKEN} -Dsonar.organization=molgenis -Dsonar.host.url=https://sonarcloud.io -Dsonar.verbose=true \

    - run:
        name: either release or push only snapshots to docker
        command: |
          export $( cat build/ci.properties | xargs )
          if [[ "$TAG_NAME" == *"SNAPSHOT"* ]]; then
            ./gradlew -s --no-daemon dockerPush
            docker build apps/catalogue/ -t molgenis/ssr-catalogue-snapshot:latest -t molgenis/ssr-catalogue-snapshot:${TAG_NAME}
            docker push molgenis/ssr-catalogue-snapshot --all-tags
          else
            ./gradlew -s --no-daemon dockerPush release
            docker build apps/catalogue/ -t molgenis/ssr-catalogue:latest -t molgenis/ssr-catalogue:${TAG_NAME}
            docker push molgenis/ssr-catalogue --all-tags
          fi

    - run:
        name: update azure demo server
        command: |
          export $( cat build/ci.properties | xargs )
          bash ci/set_kubectl_config-azure.sh
          bash ci/create_or_update_k8s-azure.sh "emx2" ${TAG_NAME} false false

    - run:
        name: message slack about release and updated demo server
        command: |
          export $( cat build/ci.properties | xargs )
          curl -d "token=${SLACK_TOKEN}" \
          -d "text=EMX2 version: ${TAG_NAME} is released. Check it out: https://emx2.dev.molgenis.org" \
          -d "channel=C02AZDG6QQ7" \
          -X POST https://slack.com/api/chat.postMessage  

    - post_steps

  preview:
    <<: *build_config

    steps:
    - run: |
        echo "PR number: ${CIRCLE_PULL_REQUEST##*/}"

    - pre_steps

    - attach_workspace:
        at: .

    - run:
        name: build and push emx2 java docker images for the preview
        command: |
          export $( cat build/ci.properties | xargs )
          docker build . -t ${IMAGE_NAME}:${TAG_NAME} -t ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME} --all-tags

    - run:
        name: push ssr-catalogue docker images
        command: |
          export $( cat build/ci.properties | xargs )
          docker build apps/catalogue/ -t molgenis/ssr-catalogue-snapshot:latest -t molgenis/ssr-catalogue-snapshot:${TAG_NAME}
          docker push molgenis/ssr-catalogue-snapshot --all-tags

    - run:
        name: Docker-Scout scanning on cve's, break on critical.
        command: |
          export $( cat build/ci.properties | xargs )
          curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s
          docker scout cves molgenis/molgenis-emx2-snapshot:${TAG_NAME} --only-severity critical --ignore-suppressed --only-fixed --exit-code

    - run:
        name: Start preview in limited resources mode
        command: |
          export $( cat build/ci.properties | xargs )
          bash ci/set_kubectl_config-azure.sh molgenis-emx2-13.79.1-SNAPSHOT-all.jar molgenis-emx2-13.79.1-SNAPSHOT-all.jar
          bash ci/create_or_update_k8s-azure.sh "preview-emx2-pr-${CIRCLE_PULL_REQUEST##*/}" ${TAG_NAME} true false

    - run:
        name: Wait for pr preview restart, poll every 10 seconds
        command: |
          GETURL="https://preview-emx2-pr-${CIRCLE_PULL_REQUEST##*/}.dev.molgenis.org/directory-demo/directory/"           
          while true; 
              do 
                  STATUS=$(curl --silent --head $GETURL | awk '/^HTTP/{print $2}')
                  echo ${STATUS} ${GETURL}
                  if [[ "$STATUS" == "200" ]]; then 
                      echo "test data is loaded";
                      break; 
                  else 
                      echo "preview is not ready yet, waiting 10 seconds...";
                  fi; 
                  sleep 10; 
              done

    - run:
        name: message slack about preview
        command: |
          export $( cat build/ci.properties | xargs )
          curl -d "token=${SLACK_TOKEN}" \
          -d "text=*<${CIRCLE_PULL_REQUEST}|Circle-CI » Molgenis » Molgenis-emx2 » PR-${CIRCLE_PULL_REQUEST##*/} #${CIRCLE_BUILD_NUM}>*
          PR Preview available on https://preview-emx2-pr-${CIRCLE_PULL_REQUEST##*/}.dev.molgenis.org" \
          -d "channel=C02AZDG6QQ7" \
          -X POST https://slack.com/api/chat.postMessage

    - post_steps

  emx2-pyclient:
    <<: *build_config

    steps:
      - pre_steps
      - gradle_pre_steps
      - run:
          name: Reset TWINE_PASSWORD in case of release to PyPI (default is testPyPI token)
          command: |
            if [ -z "$CIRCLE_PULL_REQUEST" ]; then
               echo "Reset testPyPI token to PyPI token"
               echo "export TWINE_PASSWORD=$PYPI_PASSWORD" >> "$BASH_ENV"
            fi
      - run:
          name: Release to (test)PyPI based on commit message
          command: |
            export REGEX="^.*(emx2-pyclient).*$"
            if [[ $(git log -1 --pretty=format:%s) =~ $REGEX ]]; then
              export $( cat build/ci.properties | xargs )
              ./gradlew -s --no-daemon publishPython > pypi_output
              curl -d "token=${SLACK_TOKEN}" \
              -d "text=*<${CIRCLE_PULL_REQUEST}|Circle-CI » Molgenis » Molgenis-emx2 » PR-${CIRCLE_PULL_REQUEST##*/} #${CIRCLE_BUILD_NUM}>*
              A new molgenis-emx2-pyclient version is released: $( grep 'View at:' pypi_output -A 1 | grep -v 'View at:' )" \
              -d "channel=C02AZDG6QQ7" \
              -X POST https://slack.com/api/chat.postMessage
            else
              echo "No release to (test)PyPI needed"
            fi
      - run:
          name: Message slack about a new molgenis-emx2-pyclient version
          command: |
            export REGEX="^.*(emx2-pyclient).*$"
            if [[ $(git log -1 --pretty=format:%s) =~ $REGEX ]]; then
              curl -d "token=${SLACK_TOKEN}" \
              -d "text=*<${CIRCLE_PULL_REQUEST}|Circle-CI » Molgenis » Molgenis-emx2 » PR-${CIRCLE_PULL_REQUEST##*/} #${CIRCLE_BUILD_NUM}>*
              A new molgenis-emx2-pyclient version is released: $( grep 'View at:' pypi_output -A 1 | grep -v 'View at:' )" \
              -d "channel=C02AZDG6QQ7" \
              -X POST https://slack.com/api/chat.postMessage
            fi           

  delete-helm-preview:
    <<: *build_config

    environment:
      GHA_PREVIEW_NR: << pipeline.parameters.GHA_Meta >>
    
    steps:
    - pre_steps
    
    - run:
        name: delete preview on azure
        command: |
          export $( cat build/ci.properties | xargs )
          bash ci/set_kubectl_config-azure.sh
          kubectl delete namespace preview-emx2-pr-${GHA_PREVIEW_NR} || true

  clear-dev-db-every-3-weeks:
    <<: *build_config

    steps:
      - pre_steps

      # Check if we should run this week
      - run:
          name: Check if it's the 3rd week
          command: |
            WEEK_NUM=$(date +%V)
            echo "Current week number: $WEEK_NUM"
            if [ $(( WEEK_NUM % 3 )) -ne 0 ]; then
              echo "⏭️ Not week 3, 6, 9... skipping job."
              circleci step halt
            fi

      - run:
          name: Reset emx2.dev
          command: |
            export $( cat build/ci.properties | xargs )
            bash ci/set_kubectl_config-azure.sh
            bash ci/create_or_update_k8s-azure.sh "emx2" latest false true
          working_directory: repo

      - run:
          name: Message slack about a database cleanup
          command: |
            curl -d "token=${SLACK_TOKEN}" \
            -d "cleaned database at https://emx2.dev.molgenis.org/" \
            -d "channel=C057JRKLUKG" \
            -X POST https://slack.com/api/chat.postMessage
             
      
      


workflows:
  version: 2
  build_and_test_and_preview_or_release:
    unless:
      equal: [ "delete-pr-preview", << pipeline.parameters.GHA_Action >> ]
    jobs:
    - preview:
        requires:
          - build
        filters:
          branches:
            ignore: master
    - test:
       filters:
         branches:
           ignore: master
    - build:
        filters:
          branches:
            ignore: master
    - e2e-tests:
        requires:
          - build
    - emx2-pyclient:
        name: testPyPI release
        filters:
          branches:
            ignore: master
    - release:
       filters:
         branches:
           only: master
    - emx2-pyclient:
        name: PyPI release
        requires:
          - release
        filters:
          branches:
            only: master

  delete_preview:
    when:
      equal: [ "delete-pr-preview", << pipeline.parameters.GHA_Action >> ]
    jobs:
    - delete-helm-preview

  clear-dev-db:
    triggers:
      - schedule:
          cron: "0 7 * * 1" # every Monday 07:00 UTC as cron can not do every 3 weeks
          filters:
            branches:
              only: master
    jobs:
      - clear-dev-db-every-3-weeks
