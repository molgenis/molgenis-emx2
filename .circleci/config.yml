version: 2.1

parameters:
  GHA_Actor:
    type: string
    default: ""
  GHA_Event:
    type: string
    default: ""
  GHA_Action:
    type: string
    default: ""
  GHA_Meta:
    type: string
    default: ""

orbs:
  slack: circleci/slack@6.1.3

definitions:
  # A cache restores to the absolute path it was saved from, and `~` differs per image.
  job_env: &job_env
    GRADLE_USER_HOME: /tmp/ci-cache/gradle
    GRADLE_BUILD_CACHE_DIR: /tmp/ci-cache/gradle-build-cache
    TURBO_CACHE_DIR: /tmp/ci-cache/turbo
    GRADLE_OPTS: "-Dorg.gradle.workers.max=2 -Dorg.gradle.console=plain"
    TERM: dumb

  build_config: &build_config
    docker:
    - image: molgenis/ci-build:1.6.3
    working_directory: ~/repo
    resource_class: large
    environment: *job_env
  test_config: &test_config
    docker:
    - image: molgenis/ci-build:1.6.3
    - image: postgres:15-alpine
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
    working_directory: ~/repo
    resource_class: large
    environment: *job_env
  release_config: &release_config
    docker:
      - image: molgenis/ci-build:1.6.3
    working_directory: ~/repo
    resource_class: large
    environment: *job_env


commands:
  pre_steps:
    steps:
    - run:
        name: Report the CPUs and memory visible to the container and JVM
        command: |
          set +e
          echo "nproc: $(nproc)"
          java -XshowSettings:system -version
          echo 'public class Cpus { public static void main(String[] a) { System.out.println("availableProcessors: " + Runtime.getRuntime().availableProcessors()); } }' > /tmp/Cpus.java
          javac -d /tmp /tmp/Cpus.java && java -cp /tmp Cpus || true
    - run:
        name: Fresh Git Checkout to prevent missing objects
        command: |
          rm -rf .git
          git init
          git remote add origin "$CIRCLE_REPOSITORY_URL"
          GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" \
            git fetch origin +refs/heads/*:refs/remotes/origin/* --prune
          GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" \
            git fetch origin +refs/tags/*:refs/tags/* --prune
          git checkout -f "$CIRCLE_BRANCH"
          # Nyx peels ~2000 tags per commit it walks; that costs master 70s per gradle start; packs are smaller
          git pack-refs --all
    - run:
        name: Make the directory the long steps tee their whole log into
        command: mkdir -p ~/gradle-logs
    - run:
        name: Setup git, todo, move to molgenisci user
        command: |
          git config --global --add safe.directory '*'
          git config user.email "m.a.swertz@rug.nl"
          git config user.name "mswertz"
          git config url.https://.insteadOf git://
    - run:
        name: run-pnpm-audit
        command:  pnpm dlx --config.minimumReleaseAge=0 pnpm@11.0.0-rc.1 --config.manage-package-manager-versions=false audit --audit-level=critical
        working_directory: apps

  # The layer cache only pays where an image gets built: elsewhere it stores nothing, at 200 credits a run.
  docker_setup:
    steps:
    - setup_remote_docker:
        docker_layer_caching: true
    - run:
        name: Sign in to docker
        command: docker login -u $DOCKER_USER -p $DOCKER_PASS

  restore_gradle_deps:
    steps:
    - run:
        name: Concatenate build files as the dependency cache key
        command: git ls-files -z '*build.gradle' | xargs -0 cat > concatenated-build-gradle
    - restore_cache:
        keys:
          - gradle-deps-v4-{{ checksum "concatenated-build-gradle" }}
          - gradle-deps-v4-

  save_gradle_deps:
    steps:
    - save_cache:
        paths:
          - /tmp/ci-cache/gradle
        key: gradle-deps-v4-{{ checksum "concatenated-build-gradle" }}

  restore_gradle_build_cache:
    steps:
    # A restore takes the FIRST key that matches, so master's pool needs its own step to be reached.
    - when:
        condition:
          not:
            equal: [ master, << pipeline.git.branch >> ]
        steps:
        - restore_cache:
            keys:
              - gradle-buildcache-v4-master-
    - restore_cache:
        keys:
          - gradle-buildcache-v4-{{ .Branch }}-
          - gradle-buildcache-v4-master-
          - gradle-buildcache-v4-

  save_gradle_build_cache:
    steps:
    - run:
        name: Cap the gradle build cache at 2GB, dropping the oldest entries first
        command: |
          if [ -d "$GRADLE_BUILD_CACHE_DIR" ]; then
            cd "$GRADLE_BUILD_CACHE_DIR"
            ls -lt | awk -v limit=2147483648 '$NF ~ /^[0-9a-f]{32}$/ { total += $5; if (total > limit) print $NF }' |
              while read -r entry; do rm -f "$entry"; done
            du -sh .
          else
            echo "no gradle build cache to prune"
          fi
        when: always
    - save_cache:
        paths:
          - /tmp/ci-cache/gradle-build-cache
        key: gradle-buildcache-v4-{{ .Branch }}-{{ .Revision }}
        when: always

  restore_turbo_cache:
    steps:
    - restore_cache:
        keys:
          - turbo-v3-{{ .Branch }}-
          - turbo-v3-master-
          - turbo-v3-
    # Same reason as the gradle cache above; the flat entries union rather than collide.
    - when:
        condition:
          not:
            equal: [ master, << pipeline.git.branch >> ]
        steps:
        - restore_cache:
            keys:
              - turbo-v3-master-

  save_turbo_cache:
    steps:
    - run:
        name: Cap the turbo cache at 2GB, dropping the oldest entries first
        command: |
          if ls /tmp/ci-cache/turbo/*.tar.zst >/dev/null 2>&1; then
            cd /tmp/ci-cache/turbo
            ls -lt *.tar.zst | awk -v limit=2147483648 '{ total += $5 } total > limit { sub(/\.tar\.zst$/, "", $NF); print $NF }' |
              while read -r entry; do rm -f "$entry".tar.zst "$entry"-meta.json "$entry"-manifest.json; done
            du -sh .
          else
            echo "no turbo cache to prune"
          fi
        when: always
    - save_cache:
        paths:
          - /tmp/ci-cache/turbo
        key: turbo-v3-{{ .Branch }}-{{ .Revision }}
        when: always

  post_steps:
    steps:
    - run:
        name: Save test results for stats
        command: |
          mkdir -p ~/test-results/junit/
          find . -type f -regex ".*/build/test-results/.*xml" -exec cp {} ~/test-results/junit/ \;
        when: always
    - store_test_results:
        path: ~/test-results
    - store_artifacts:
        path: ~/test-results
        when: always
    - store_artifacts:
        path: ~/gradle-logs
        when: always

# jobs for pull request and master
jobs:
  build-preview-images:
    <<: *build_config
    steps:
    - run: |
        echo "PR number: ${CIRCLE_PULL_REQUEST##*/}"

    - pre_steps
    - restore_gradle_deps
    - docker_setup
    - restore_gradle_build_cache
    - restore_turbo_cache

    - run:
        name: build and push emx2 java docker images for the preview
        command: |
          set -o pipefail
          ./gradlew -s --no-daemon dockerPush ci -x test \
          2>&1 | tee ~/gradle-logs/build-preview-images.log

    - run:
        name: push ssr-catalogue docker images
        command: |
          export $( cat build/ci.properties | xargs )
          docker build apps/catalogue/ -t molgenis/ssr-catalogue-snapshot:latest -t molgenis/ssr-catalogue-snapshot:${TAG_NAME}
          docker push molgenis/ssr-catalogue-snapshot --all-tags

    - run:
        name: Start preview in limited resources mode
        command: |
          export $( cat build/ci.properties | xargs )
          bash ci/set_kubectl_config-azure.sh
          bash ci/create_or_update_k8s-azure.sh "preview-emx2-pr-${CIRCLE_PULL_REQUEST##*/}" ${TAG_NAME} true false

    - run:
        name: Docker-Scout scanning on cve's, break on critical.
        command: |
          export $( cat build/ci.properties | xargs )
          curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s
          docker scout cves molgenis/molgenis-emx2-snapshot:${TAG_NAME} --only-severity critical --ignore-suppressed --only-fixed --exit-code

    - post_steps


  test-e2e:
    docker:
    - image: cimg/openjdk:21.0-browsers
    - image: postgres:15-alpine
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
    working_directory: ~/repo
    resource_class: large
    environment: *job_env

    steps:
      # pre_steps calls `pnpm dlx`, so pnpm must exist before it runs.
      - run:
          name: Enable pnpm
          command: sudo corepack enable

      # This job restores its own gradle cache below, into the GRADLE_USER_HOME set above.
      - pre_steps
      - restore_gradle_deps

      # same resource_class, but 15GB against the plain executor's 8GB, which postgres OOMs on
      - setup_remote_docker

      - restore_gradle_build_cache
      - restore_turbo_cache

      - run:
          name: build the application without running tests to speed up the e2e tests
          command: ./gradlew shadowJar -x test ci --no-daemon
          # Node sizes its default heap from HOST memory, not the 8GB this job shares with postgres.
          environment:
            NODE_OPTIONS: --max-old-space-size=2048

      - run:
          name: build ssr catalogue
          command: pnpm build
          working_directory: apps/catalogue
          environment:
            NODE_OPTIONS: --max-old-space-size=2048

      - run:
          name: Put custom app next to jar
          command: cp -r custom-app build/libs/custom-app

      - run:
          name: install postgres client
          command: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run:
          name: prepare sql test database
          command: psql -h 127.0.0.1 -p 5432 -U postgres < .circleci/initdb.sql

      # Only chromium: every playwright.config.ts uses devices["Desktop Chrome"], and no config sets channel.
      # Installed from e2e/, which pins @playwright/test 1.62.0; the browser cache is shared with the apps suites.
      - run:
          name: Install e2e deps and playwright browser
          command: |
            pnpm install
            npx playwright install --with-deps chromium
          working_directory: e2e
          no_output_timeout: 5m

      - run:
          name: start the application in the background
          command: |
            export $( cat build/ci.properties | xargs )
            export MOLGENIS_INCLUDE_CATALOGUE_DEMO=true
            export MOLGENIS_INCLUDE_TYPE_TEST_DEMO=true
            export MOLGENIS_INCLUDE_PATIENT_REGISTRY_DEMO=true
            export MOLGENIS_INCLUDE_DIRECTORY_DEMO=true
            export E2E_BASE_URL=http://localhost:8080/
            export MOLGENIS_OIDC_CLIENT_ID=emx2-local
            export MOLGENIS_OIDC_CLIENT_SECRET=${LOCAL_OIDC_CLIENT_SECRET}
            export MOLGENIS_OIDC_DISCOVERY_URL=https://auth1.molgenis.net/realms/Molgenis/.well-known/openid-configuration
            nohup java -jar build/libs/molgenis-emx2-*-all.jar > application.log 2>&1 < /dev/null &
            echo $! > application.pid
            echo "Started PID: $(cat application.pid)"
            sleep 5
            echo "Checking if process is still running..."
            ps -p $(cat application.pid) || echo "❌ Process died immediately"
            echo "Last logs:"
            tail -200 application.log

      - run:
          name: Wait for application to be up, poll every 5 seconds
          command: |
            GETURL="http://localhost:8080/pet%20store/tables#/"
            MAX_RETRIES=480
            RETRY=0

            while true; do
              STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" "$GETURL" || echo "")

              echo "HTTP status: ${STATUS:-none}"

              if [[ "$STATUS" == "200" ]]; then
              echo "✅ Application is up"
              break
              else
              echo "⏳ Application not ready yet, waiting 5 seconds..."
              fi

              RETRY=$((RETRY + 1))
              if [[ "$RETRY" -ge "$MAX_RETRIES" ]]; then
              echo "❌ Gave up after $MAX_RETRIES attempts"
              exit 1
              fi

              sleep 1
            done

      - run:
          name: Install app dependencies
          command: pnpm install
          working_directory: apps

      - run:
          name: Test tailwind components
          command: |
            export E2E_BASE_URL=http://localhost:8080/apps/tailwind-components/#/
            pnpm --filter tailwind-components run e2e
          working_directory: apps

      - store_test_results:
          path: apps/tailwind-components/test-results

      - store_artifacts:
          path: apps/tailwind-components/test-results

      - store_artifacts:
          path: apps/tailwind-components/playwright-report

      - run:
          name: Directory e2e tests
          command: |
            export E2E_BASE_URL=http://localhost:8080/
            pnpm --filter directory run e2e
          working_directory: apps

      - store_test_results:
          path: apps/directory/test-results

      - store_artifacts:
          path: apps/directory/test-results

      - run:
          name: UI tests
          command: |
            export E2E_BASE_URL=http://localhost:8080/apps/ui/
            pnpm --filter ui run e2e
          working_directory: apps

      - store_test_results:
          path: apps/ui/test-results

      - store_artifacts:
          path: apps/ui/test-results

      - run:
          name: Run non ssr e2e tests
          command: |
            export $( cat ~/repo/build/ci.properties | xargs )
            npx playwright test tests
          working_directory: e2e

      - store_test_results:
          path: e2e/test-results

      - store_artifacts:
          path: e2e/test-results

      - run:
          name: Catalogue ssr tests
          command: |
            export NUXT_PUBLIC_API_BASE=http://localhost:8080/
            pnpm --filter catalogue run e2e
          working_directory: apps

      - store_test_results:
          path: apps/catalogue/test-results

      - store_artifacts:
          path: apps/catalogue/test-results

  test-apps:
    <<: *build_config

    steps:
    - pre_steps
    - restore_gradle_deps

    # same resource_class, but 15GB against the plain executor's 8GB, which turbo's 3 linters OOM on
    - setup_remote_docker

    - restore_gradle_build_cache
    - restore_turbo_cache

    - run:
        name: <apps> check code format
        command: ./gradlew :apps:format

    - run:
        name: <apps> lint the code
        command: |
          set -o pipefail
          ./gradlew lint ci \
          -Dorg.ajoberstar.grgit.auth.username=${GITHUB_TOKEN} -Dorg.ajoberstar.grgit.auth.password \
          2>&1 | tee ~/gradle-logs/test-apps-lint.log
        # Turbo lints 3 packages at once, each Node child sizing its heap from HOST memory.
        environment:
          NODE_OPTIONS: --max-old-space-size=2048

    - run:
        name: <apps> unit test the code
        command: ./gradlew :apps:test
        environment:
          NODE_OPTIONS: --max-old-space-size=2048

    # lint dependsOn build, so this run produces the whole set. The only writer of this cache.
    - save_turbo_cache

    - post_steps

  test-backend:
    <<: *test_config

    steps:
    - pre_steps
    - restore_gradle_deps

    # same resource_class, but 15GB against the plain executor's 8GB, which postgres OOMs on
    - setup_remote_docker

    # No turbo restore: `:apps` is runtimeOnly, so this job schedules no `:apps:*` task.
    - restore_gradle_build_cache

    - run:
        name: prepare sql test database
        command: psql -h 127.0.0.1 -p 5432 -U postgres < .circleci/initdb.sql

    - run:
        name: <backend> check code format
        command: |
          ./gradlew --continue spotlessCheck
    - run: # Separate from spotless due to pmd running compile step (and therefore spotlessApply)
        name: <backend> check for programming flaws
        command: |
          ./gradlew --continue pmdMain pmdTest
    - run:
        name: run tests and merge coverage
        # Split from sonar so each carries its own timing.
        command: |
          # CircleCI truncates a step log to its last 400KB, so tee keeps it whole on disk.
          # pipefail keeps the step failing on gradle's exit code rather than tee's.
          set -o pipefail
          ./gradlew test jacocoMergedReport -x :apps:test \
          -Dorg.ajoberstar.grgit.auth.username=${GITHUB_TOKEN} -Dorg.ajoberstar.grgit.auth.password \
          2>&1 | tee ~/gradle-logs/test-backend.log
    - run:
        name: push results to sonar
        # sonar rejects an empty pullrequest.key, and master has no PR, so the
        # pull-request flags are only passed when there is one.
        command: |
          SONAR_PR_ARGS=""
          if [ -n "$CIRCLE_PULL_REQUEST" ]; then
            SONAR_PR_ARGS="-Dsonar.pullrequest.key=${CIRCLE_PULL_REQUEST##*/} -Dsonar.pullrequest.branch=${CIRCLE_BRANCH}"
          fi
          ./gradlew sonar -x :apps:test \
          -Dorg.ajoberstar.grgit.auth.username=${GITHUB_TOKEN} -Dorg.ajoberstar.grgit.auth.password \
          -Dsonar.token=${SONAR_TOKEN} -Dsonar.organization=molgenis -Dsonar.host.url=https://sonarcloud.io -Dsonar.verbose=true \
          $SONAR_PR_ARGS

    # Every backend module, test, pmd and spotless runs here. The only writer of these caches.
    - save_gradle_deps
    - save_gradle_build_cache

    - post_steps

  release:
    <<: *release_config

    steps:
    - pre_steps
    - restore_gradle_deps
    - docker_setup
    - restore_gradle_build_cache
    - restore_turbo_cache

    - run:
        name: Switch git remote to HTTPS for Nyx tag push
        command: git remote set-url origin https://github.com/molgenis/molgenis-emx2.git

    - run:
        name: build the docker image
        command: |
          set -o pipefail
          ./gradlew ci dockerBuild \
          -Dorg.ajoberstar.grgit.auth.username=${GITHUB_TOKEN} -Dorg.ajoberstar.grgit.auth.password \
          2>&1 | tee ~/gradle-logs/release-dockerbuild.log

    - run:
        name: either release or push only snapshots to docker
        command: |
          export $( cat build/ci.properties | xargs )
          set -o pipefail
          if [[ "$TAG_NAME" == *"SNAPSHOT"* ]]; then
            ./gradlew -s dockerPush 2>&1 | tee ~/gradle-logs/release-snapshot.log
            docker build apps/catalogue/ -t molgenis/ssr-catalogue-snapshot:latest -t molgenis/ssr-catalogue-snapshot:${TAG_NAME}
            docker push molgenis/ssr-catalogue-snapshot --all-tags
          else
            ./gradlew -s dockerPush release 2>&1 | tee ~/gradle-logs/release-publish.log
            docker build apps/catalogue/ -t molgenis/ssr-catalogue:latest -t molgenis/ssr-catalogue:${TAG_NAME}
            docker push molgenis/ssr-catalogue --all-tags
          fi

    - run:
        name: update azure demo server
        command: |
          export $( cat build/ci.properties | xargs )
          bash ci/set_kubectl_config-azure.sh
          bash ci/create_or_update_k8s-azure.sh "emx2" ${TAG_NAME} false false

    - run:
        name: message slack about release and updated demo server
        command: |
          export $( cat build/ci.properties | xargs )
          curl -d "token=${SLACK_TOKEN}" \
          -d "text=EMX2 version: ${TAG_NAME} is released. Check it out: https://emx2.dev.molgenis.org" \
          -d "channel=C02AZDG6QQ7" \
          -X POST https://slack.com/api/chat.postMessage  

    - post_steps

  pr-preview:
    <<: *build_config
    resource_class: small

    steps:
    - run:
        name: Wait for pr preview restart, poll every 10 seconds
        command: |
          GETURL="https://preview-emx2-pr-${CIRCLE_PULL_REQUEST##*/}.dev.molgenis.org/directory-demo/directory/"           
          while true; 
              do 
                  STATUS=$(curl --silent --head $GETURL | awk '/^HTTP/{print $2}')
                  echo ${STATUS} ${GETURL}
                  if [[ "$STATUS" == "200" ]]; then 
                      echo "test data is loaded";
                      break; 
                  else 
                      echo "preview is not ready yet, waiting 10 seconds...";
                  fi; 
                  sleep 10; 
              done

    - run:
        name: message slack about preview
        command: |
          curl -d "token=${SLACK_TOKEN}" \
          -d "text=*<${CIRCLE_PULL_REQUEST}|Circle-CI » Molgenis » Molgenis-emx2 » PR-${CIRCLE_PULL_REQUEST##*/} #${CIRCLE_BUILD_NUM}>*
          PR Preview available on https://preview-emx2-pr-${CIRCLE_PULL_REQUEST##*/}.dev.molgenis.org" \
          -d "channel=C02AZDG6QQ7" \
          -X POST https://slack.com/api/chat.postMessage

    - post_steps

  emx2-pyclient:
    <<: *build_config
    resource_class: medium

    steps:
      - pre_steps
      - run:
          name: Reset TWINE_PASSWORD in case of release to PyPI (default is testPyPI token)
          command: |
            if [ -z "$CIRCLE_PULL_REQUEST" ]; then
               echo "Reset testPyPI token to PyPI token"
               echo "export TWINE_PASSWORD=$PYPI_PASSWORD" >> "$BASH_ENV"
            fi
      - run:
          name: Release to (test)PyPI based on commit message
          command: |
            export REGEX="^.*(emx2-pyclient).*$"
            if [[ $(git log -1 --pretty=format:%s) =~ $REGEX ]]; then
              export $( cat build/ci.properties | xargs )
              ./gradlew -s --no-daemon publishPython > pypi_output
              curl -d "token=${SLACK_TOKEN}" \
              -d "text=*<${CIRCLE_PULL_REQUEST}|Circle-CI » Molgenis » Molgenis-emx2 » PR-${CIRCLE_PULL_REQUEST##*/} #${CIRCLE_BUILD_NUM}>*
              A new molgenis-emx2-pyclient version is released: $( grep 'View at:' pypi_output -A 1 | grep -v 'View at:' )" \
              -d "channel=C02AZDG6QQ7" \
              -X POST https://slack.com/api/chat.postMessage
            else
              echo "No release to (test)PyPI needed"
            fi
      - run:
          name: Message slack about a new molgenis-emx2-pyclient version
          command: |
            export REGEX="^.*(emx2-pyclient).*$"
            if [[ $(git log -1 --pretty=format:%s) =~ $REGEX ]]; then
              curl -d "token=${SLACK_TOKEN}" \
              -d "text=*<${CIRCLE_PULL_REQUEST}|Circle-CI » Molgenis » Molgenis-emx2 » PR-${CIRCLE_PULL_REQUEST##*/} #${CIRCLE_BUILD_NUM}>*
              A new molgenis-emx2-pyclient version is released: $( grep 'View at:' pypi_output -A 1 | grep -v 'View at:' )" \
              -d "channel=C02AZDG6QQ7" \
              -X POST https://slack.com/api/chat.postMessage
            fi           

  delete-helm-preview:
    <<: *build_config

    environment:
      GHA_PREVIEW_NR: << pipeline.parameters.GHA_Meta >>
    
    steps:
    - pre_steps


    - run:
        name: delete preview on azure
        command: |
          export $( cat build/ci.properties | xargs )
          bash ci/set_kubectl_config-azure.sh
          kubectl delete namespace preview-emx2-pr-${GHA_PREVIEW_NR} || true

  clear-dev-db-every-3-weeks:
    <<: *build_config

    steps:
      - pre_steps

      # Check if we should run this week
      - run:
          name: Check if it's the 3rd week
          command: |
            WEEK_NUM=$(date +%V)
            echo "Current week number: $WEEK_NUM"
            if [ $(( WEEK_NUM % 3 )) -ne 0 ]; then
              echo "⏭️ Not week 3, 6, 9... skipping job."
              circleci step halt
            fi

      - run:
          name: Reset emx2.dev
          command: |
            export $( cat build/ci.properties | xargs )
            bash ci/set_kubectl_config-azure.sh
            bash ci/create_or_update_k8s-azure.sh "emx2" latest false true
             
      - run:
          name: Message slack about a database cleanup
          command: |
            curl -X POST -H "Authorization: Bearer ${SLACK_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"channel":"C057JRKLUKG","text":"cleaned database at https://emx2.dev.molgenis.org/"}' \
            https://slack.com/api/chat.postMessage
      


workflows:
  version: 2
  build_and_test_and_preview_or_release:
    unless:
      equal: [ "delete-pr-preview", << pipeline.parameters.GHA_Action >> ]
    jobs:
    # Listed longest-first among the jobs nothing blocks, so a queued pipeline starts the critical
    # path earliest. build-preview-images is short but gates pr-preview, the longest chain.
    - build-preview-images:
        filters:
          branches:
            ignore: master
    - test-backend
    - test-e2e
    - test-apps
    - pr-preview:
        requires:
          - build-preview-images
        filters:
          branches:
            ignore: master
    - release:
       requires:
         - test-apps
         - test-backend
         - test-e2e
       filters:
         branches:
           only: master
    - emx2-pyclient:
        name: testPyPI release
        filters:
          branches:
            ignore: master
    - emx2-pyclient:
        name: PyPI release
        requires:
          - release
        filters:
          branches:
            only: master

  delete_preview:
    when:
      equal: [ "delete-pr-preview", << pipeline.parameters.GHA_Action >> ]
    jobs:
    - delete-helm-preview

  clear-dev-db:
    triggers:
      - schedule:
          cron: "0 7 * * 1" # every Monday 07:00 UTC as cron can not do every 3 weeks
          filters:
            branches:
              only: master
    jobs:
      - clear-dev-db-every-3-weeks
