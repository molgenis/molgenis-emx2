# Gradle
# Build your Java project and run tests with Gradle using a Gradle wrapper script.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

#trigger only on master or PR to master
trigger:
- master
pr:
- master

pool:
  vmImage: ubuntu-24.04

resources:
  containers:
  - container: build
    image: molgenis/ci-build:1.6.4
    options: --user 0:0
  - container: postgres
    image: postgres:15-alpine
    env:
      POSTGRES_PASSWORD: postgres
    ports:
    - 5432:5432

container: build

services:
  postgres: postgres

steps:
# Nyx derives the version from git tags at gradle configuration time, and the default checkout is
# shallow and tagless.
- checkout: self
  fetchDepth: 0
  fetchTags: true
- script: |
    until pg_isready -h postgres -U postgres; do sleep 1; done
    psql -h postgres -U postgres < .circleci/initdb.sql
  displayName: initialize database
  env:
    PGPASSWORD: postgres
- script: |
    ./gradlew -version
    ./gradlew test jacocoMergedReport -x :apps:test
  # sonarqube -Dsonar.login=$(SONAR_TOKEN) -Dsonar.organization=molgenis -Dsonar.host.url=https://sonarcloud.io -Dorg.ajoberstar.grgit.auth.username=$(GITHUB_TOKEN) -Dorg.ajoberstar.grgit.auth.password
  displayName: run tests

  env:
    MOLGENIS_POSTGRES_USER: molgenis
    MOLGENIS_POSTGRES_PASS: molgenis
    MOLGENIS_POSTGRES_URI: jdbc:postgresql://postgres/molgenis
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
    CI: true
