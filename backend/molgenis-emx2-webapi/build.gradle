dependencies {
    implementation project(':backend:molgenis-emx2-sql')
    implementation project(':backend:molgenis-emx2-io')
    implementation project(':backend:molgenis-emx2-graphql')
    implementation project(':backend:molgenis-emx2')
    implementation project(':backend:molgenis-emx2-datamodels')
    implementation project(':backend:molgenis-emx2-rdf')
    implementation project(':backend:molgenis-emx2-beacon-v2')
    implementation project(':backend:molgenis-emx2-cafevariome')
    implementation project(':backend:molgenis-emx2-fairdatapoint')
    implementation project(':backend:molgenis-emx2-tasks')
    implementation project(':backend:molgenis-emx2-email')
    implementation project(':backend:molgenis-emx2-analytics')

    implementation 'org.graalvm.polyglot:polyglot:25.2.4'
    implementation group: 'io.swagger.parser.v3', name:'swagger-parser', version:swaggerParserVersion
    implementation group: 'com.squareup.okhttp3', name:'okhttp', version:squareupVersion
    implementation group: 'com.squareup.okhttp3', name:'okhttp-brotli', version:squareupVersion
    implementation 'com.github.dfabulich:sitemapgen4j:1.1.2'
    implementation group: 'de.larsgrefer.sass', name:'sass-embedded-host', version:sassEmbeddedHostVersion
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'

    implementation 'io.prometheus:prometheus-metrics-core:1.8.0'
    implementation 'io.prometheus:prometheus-metrics-instrumentation-jvm:1.8.0'
    implementation 'io.prometheus:prometheus-metrics-exporter-httpserver:1.8.0'
    implementation 'io.prometheus:prometheus-metrics-exporter-servlet-jakarta:1.8.0'

    testImplementation group: 'io.rest-assured', name:'rest-assured', version:restAssuredVersion
    testImplementation group: 'org.apache.poi', name:'poi', version:poiVersion
    testImplementation group: 'org.apache.poi', name:'poi-ooxml', version:poiVersion
    testImplementation group: 'net.lingala.zip4j', name:'zip4j', version:zip4jVersion
    testImplementation 'uk.org.webcompere:system-stubs-jupiter:2.1.8'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'

    testFixturesApi project(':backend:molgenis-emx2-sql')
    testFixturesApi project(':backend:molgenis-emx2')
    testFixturesApi 'io.rest-assured:rest-assured:5.5.7'
    testFixturesImplementation 'uk.org.webcompere:system-stubs-jupiter:2.1.8'
}

tasks.register('dev', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.molgenis.emx2.RunMolgenisEmx2')
    rootProject.ext.applyDotenvHeap(it)
}
