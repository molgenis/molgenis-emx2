plugins {
    id 'java-library'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.11'
}

application {
    mainClass = 'org.molgenis.emx2.fairmapper.cli.FairMapper'
}

shadowJar {
    zip64 = true
    archiveBaseName = 'fairmapper'
    archiveClassifier = 'cli'
    mergeServiceFiles()

    // Multi-release is needed for graalvm lib
    manifest {
        attributes(
                "Multi-Release": "true"
        )
    }

    exclude("META-INF/*.SF")
    exclude("META-INF/*.DSA")
    exclude("META-INF/*.RSA")

}

dependencies {
    implementation project(':backend:molgenis-emx2-io')
    implementation project(':backend:molgenis-emx2-rdf')
    implementation project(':backend:molgenis-emx2')
    implementation project(':backend:molgenis-emx2-sql')
    implementation project(':backend:molgenis-emx2-tasks')
    implementation project(':backend:molgenis-emx2-webapi')
    implementation project(':backend:molgenis-emx2-graphql')

    implementation group: 'org.eclipse.rdf4j', name:'rdf4j-sparqlbuilder', version:rdf4jVersion
    implementation group: 'org.eclipse.rdf4j', name:'rdf4j-queryresultio-text', version:rdf4jVersion

    implementation group: 'com.squareup.okhttp3', name:'okhttp', version:okhttpVersion
    implementation group: 'info.picocli', name:'picocli', version:picocliVersion
    annotationProcessor group: 'info.picocli', name:'picocli-codegen', version:picocliVersion

    testImplementation testFixtures(project(':backend:molgenis-emx2-webapi'))
    testImplementation project(':backend:molgenis-emx2-datamodels')
}

test {
    useJUnitPlatform()
}

compileJava {
    options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
}